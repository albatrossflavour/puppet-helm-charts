# Generated by port/generate_files.py from cd4peadm's config() and manifests. Do not edit.
# The environment each module container gets, minus what the chart's templates set themselves.
# The chart fills in the FULLNAME, HOSTNAME and VERSION placeholders.
pipelinesinfra:
  CD4PE_EULA_ACCEPTED: 'true'
  CD4PE_QUERY_SERVICE_TOKEN_PATH: /etc/puppetlabs/cd4pe/query-service/cd4pe-query-service-token
  CD4PE_ROUTE_PREFIX: /cd4pe
  CD4PE_SECURE_COOKIE: 'false'
  CD4PE_STAGE: beta
  CD4PE_STORAGE_BUCKET: cd4pe
  CD4PE_STORAGE_PROVIDER: DISK
  CD4PE_VERSION: '@@VERSION@@'
  CD4PE_WEB_UI_ENDPOINT: https://@@HOSTNAME@@
  ENABLE_SSL_WEBHOOKS: 'false'
  LOG4J_PATH: /opt/pfi/log4j2.properties
  OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger-aio:14250
  OTEL_EXPORTER_JAEGER_SERVICE_NAME: cd4pe
  OTEL_METRICS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: service.name=cd4pe,service.version=dev
  OTEL_TRACES_EXPORTER: none
postgres: {}
query:
  CD4PE_QUERY_SERVICE_TOKEN_SECRET_NAME: /etc/puppetlabs/cd4pe/cd4pe-query-service-token
  DB_ENDPOINT: postgres://@@FULLNAME@@-postgres:5432/query
  DB_SCHEMA: estate_reporting
  DB_USER: query
  WORKSPACE_URL: http://@@FULLNAME@@-pipelinesinfra:8080/api/v1
ui:
  CD4PE_SERVICE: http://@@FULLNAME@@-pipelinesinfra:8080
  LOGGING: info
  QUERY_SERVICE: http://@@FULLNAME@@-query:8080
  TEAMS_UI_VERSION: '@@VERSION@@'
