# CD4PE log4j2 config for Kubernetes.
# Same loggers and levels as cd4peadm 5.18.0 templates/log4j2.properties.epp,
# but everything goes to the console instead of rolling files in /app/logs.
status = error
dest = err
name = PropertiesConfig
monitorInterval = 60

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.S z}:[%p]:[%t]:%c:%m%n

appender.access.type = Console
appender.access.name = Access
appender.access.layout.type = PatternLayout
appender.access.layout.pattern = access: %m%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = Console

logger.apache.name = org.apache
logger.apache.level = warn
logger.apache.additivity = false
logger.apache.appenderRef.console.ref = Console

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = info
logger.jetty.additivity = false
logger.jetty.appenderRef.console.ref = Console

logger.hibernate.name = org.hibernate
logger.hibernate.level = info
logger.hibernate.additivity = false
logger.hibernate.appenderRef.console.ref = Console

logger.jerseyApi.name = com.puppet.cdpe.web.api.accesslog
logger.jerseyApi.level = info
logger.jerseyApi.additivity = false
logger.jerseyApi.appenderRef.console.ref = Access

logger.distelliApi.name = com.distelli.webserver.WebServlet
logger.distelliApi.level = info
logger.distelliApi.additivity = false
logger.distelliApi.appenderRef.console.ref = Access
