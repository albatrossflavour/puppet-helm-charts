{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cd4pe.fullname" . }}
  labels:
    {{- include "cd4pe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cd4pe.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The components talk to each other.
    - from:
        - podSelector:
            matchLabels:
              {{- include "cd4pe.selectorLabels" . | nindent 14 }}
    # The UI and the backend endpoint, from the ingress controller wherever it runs.
    - ports:
        - port: 3000
          protocol: TCP
        - port: 8000
          protocol: TCP
{{- end }}
