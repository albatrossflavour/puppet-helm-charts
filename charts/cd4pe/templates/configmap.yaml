{{- /* CD4PE has no setting to turn self sign-up off, so unless signup.enabled
is true the UI's nginx refuses every path that reaches the backend's sign-up
handlers: the /signup page, POST /cd4pe/signup (the PfiSignup op the sign-up
form sends) and POST /cd4pe/api/v1/user/signup. It matches on $uri, which nginx
has already decoded and normalised, and it sits ahead of the rewrites, which
would otherwise redirect a GET for /cd4pe/signup before any location runs.

signup.allowedSources lets some clients through. The address checked is the
TCP peer, or, when the peer is in clientAddress.trustedProxies, the address in
clientAddress.header. Anything that isn't an address (a missing header, a
list) counts as 255.255.255.255 in geo, so it falls to the default and is
refused. The schema keeps the CIDRs and the header name to characters that
can't break out of the nginx config. */ -}}
{{- $signup := .Values.signup -}}
{{- $sources := $signup.allowedSources | default list -}}
{{- $clientAddress := $signup.clientAddress | default dict -}}
{{- $header := $clientAddress.header | default "" -}}
{{- $proxies := $clientAddress.trustedProxies | default list -}}
{{- if and $header (not $proxies) -}}
{{- fail "signup.clientAddress.trustedProxies is required when signup.clientAddress.header is set, or the header would be believed from anyone" -}}
{{- end -}}
{{- if and $proxies (not $header) -}}
{{- fail "signup.clientAddress.trustedProxies is set but signup.clientAddress.header is empty" -}}
{{- end -}}
{{- $signupHttp := "# No sign-up source check (signup.allowedSources is empty, or signup.enabled is true)." -}}
{{- $signupBlock := "# Self sign-up is open (signup.enabled is true in the chart)." -}}
{{- if not $signup.enabled -}}
{{- if $sources -}}
{{- $allowed := "" -}}
{{- range $sources -}}
{{- $allowed = printf "%s\n        %s 1;" $allowed . -}}
{{- end -}}
{{- if $header -}}
{{- $trusted := "" -}}
{{- range $proxies -}}
{{- $trusted = printf "%s\n        %s 1;" $trusted . -}}
{{- end -}}
{{- $signupHttp = printf `# Sign-up is open only to signup.allowedSources. The address checked is
    # the %s header when the peer is in signup.clientAddress.trustedProxies,
    # and the peer itself otherwise.
    geo $signup_peer_trusted {
        default 0;%s
    }
    map $signup_peer_trusted $signup_client {
        1       $http_%s;
        default $remote_addr;
    }
    geo $signup_client $signup_source_allowed {
        default 0;%s
    }` $header $trusted ($header | lower | replace "-" "_") $allowed -}}
{{- else -}}
{{- $signupHttp = printf `# Sign-up is open only to signup.allowedSources. The address checked is
    # the peer, the address of the connection to this nginx.
    geo $signup_source_allowed {
        default 0;%s
    }` $allowed -}}
{{- end -}}
{{- $signupBlock = `# Self sign-up is closed except to signup.allowedSources (signup.enabled is false in the chart).
        set $signup_refused 0;
        if ($uri ~* "/signup([/;.]|$)") {
            set $signup_refused 1;
        }
        if ($signup_source_allowed) {
            set $signup_refused 0;
        }
        if ($signup_refused) {
            return 403;
        }` -}}
{{- else -}}
{{- $signupBlock = `# Self sign-up is closed (signup.enabled is false in the chart).
        if ($uri ~* "/signup([/;.]|$)") {
            return 403;
        }` -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cd4pe.fullname" . }}-config
  labels:
    {{- include "cd4pe.labels" . | nindent 4 }}
data:
  base.conf.template: |
    {{- regexReplaceAll "(?m)[ \\t]+$" (.Files.Get "files/base.conf.template" | replace "@@SIGNUP_BLOCK@@" $signupBlock | replace "@@SIGNUP_HTTP@@" $signupHttp | nindent 4) "" }}
  log4j2.properties: |
    {{- regexReplaceAll "(?m)[ \\t]+$" (.Files.Get "files/log4j2.properties" | nindent 4) "" }}
  postgresql.conf: |
    {{- regexReplaceAll "(?m)[ \\t]+$" (.Files.Get "files/postgresql.conf" | nindent 4) "" }}
  pg_hba.conf: |
    {{- regexReplaceAll "(?m)[ \\t]+$" (.Files.Get "files/pg_hba.conf" | nindent 4) "" }}
  # What cd4peadm does with templates/postgres/initdb.sql.epp, as a script so
  # the passwords come from the environment and never sit in a file. The
  # postgres entrypoint sources it once, when the data directory is empty.
  10-cd4pe-init.sh: |
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-postgres}" --dbname postgres \
      -v cd4pe_pw="${CD4PE_DB_PASSWORD}" -v query_pw="${QUERY_DB_PASSWORD}" <<'EOSQL'
    CREATE ROLE cd4pe LOGIN PASSWORD :'cd4pe_pw';
    CREATE DATABASE cd4pe OWNER cd4pe;
    CREATE ROLE query LOGIN PASSWORD :'query_pw';
    CREATE DATABASE query OWNER query;
    REVOKE CONNECT ON DATABASE cd4pe FROM query;
    REVOKE CONNECT ON DATABASE query FROM cd4pe;
    \connect "cd4pe"
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS lo;
    CREATE EXTENSION IF NOT EXISTS pg_repack;
    EOSQL
