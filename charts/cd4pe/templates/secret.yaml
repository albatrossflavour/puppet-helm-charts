{{- if not .Values.auth.existingSecret -}}
{{- /*
Passwords are generated once. On upgrade the values already in the cluster are
read back with lookup, because the database passwords are fixed in the
Postgres volume at first start and secret-key encrypts data at rest.
lookup returns nothing under `helm template`, so rendered output shows fresh
random values every time.
*/ -}}
{{- $name := include "cd4pe.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $rootPassword := .Values.auth.rootPassword | default (get $existing "root-password" | b64dec) | default (printf "Cd4-%s-%s" (randAlphaNum 16) (randNumeric 4)) -}}
{{- $secretKey := .Values.auth.secretKey | default (get $existing "secret-key" | b64dec) | default (randAlphaNum 16 | b64enc) -}}
{{- $postgresPassword := .Values.auth.postgresPassword | default (get $existing "postgres-password" | b64dec) | default (randAlphaNum 40) -}}
{{- $cd4peDbPassword := .Values.auth.cd4peDbPassword | default (get $existing "cd4pe-db-password" | b64dec) | default (randAlphaNum 40) -}}
{{- $queryDbPassword := .Values.auth.queryDbPassword | default (get $existing "query-db-password" | b64dec) | default (randAlphaNum 40) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cd4pe.labels" . | nindent 4 }}
  {{- with (include "cd4pe.keepAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  root-password: {{ $rootPassword | b64enc | quote }}
  secret-key: {{ $secretKey | b64enc | quote }}
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  cd4pe-db-password: {{ $cd4peDbPassword | b64enc | quote }}
  query-db-password: {{ $queryDbPassword | b64enc | quote }}
{{- end }}
