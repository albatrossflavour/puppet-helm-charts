apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cd4pe.fullname" . }}-test-connection
  labels:
    {{- include "cd4pe.componentLabels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "cd4pe.podCommon" . | nindent 2 }}
  restartPolicy: Never
  containers:
    # /status on the UI is proxied to the backend, so one request proves both.
    - name: status
      image: {{ printf "%s:%s" .Values.initImage.repository .Values.initImage.tag | quote }}
      command: ["wget", "-q", "-T", "10", "-O", "-", {{ printf "http://%s-ui:3000/status" (include "cd4pe.fullname" .) | quote }}]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
