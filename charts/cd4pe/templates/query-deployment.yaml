{{- $component := "query" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cd4pe.fullname" . }}-{{ $component }}
  labels:
    {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cd4pe.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      {{- include "cd4pe.podCommon" . | nindent 6 }}
      {{- with .Values.query.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.query.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.queryToken.persistence.accessMode "ReadWriteOnce" }}
      # The token volume is ReadWriteOnce, so this pod has to share a node with pipelinesinfra.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "cd4pe.componentSelectorLabels" (dict "root" . "component" "pipelinesinfra") | nindent 18 }}
      {{- else }}
      {{- with .Values.query.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: query
          image: {{ include "cd4pe.image" (dict "root" . "image" .Values.query.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "cd4pe.secretName" . }}
                  key: query-db-password
            - name: LOG_LEVEL
              value: {{ .Values.query.logLevel | quote }}
            # cd4peadm has it log to a file. Here logs go to stdout.
            - name: LOG_TO_FILE
              value: "false"
            {{- include "cd4pe.moduleEnv" (dict "root" . "container" "query") | nindent 12 }}
            {{- with .Values.query.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            # It does not listen until pipelinesinfra has written the service token.
            failureThreshold: 90
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 6
          {{- with .Values.query.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: query-token
              mountPath: /etc/puppetlabs/cd4pe
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: query-token
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-query-token" (include "cd4pe.fullname" .)) .Values.queryToken.persistence.existingClaim }}
        - name: logs
          emptyDir: {}
