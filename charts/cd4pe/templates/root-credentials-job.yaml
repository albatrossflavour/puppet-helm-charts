{{- if .Values.rootCredentialsJob.enabled -}}
{{- $component := "root-credentials" -}}
{{- /*
cd4peadm::install::update_root_credentials: the backend image run once with a
different main class, after the schema exists. Helm runs the hook once every
pod is Ready, which is after Liquibase has finished.

UpdateRootCredentials exits 0 and logs nothing if the password fails the
product's policy. It sets the email and leaves the old password in place.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cd4pe.fullname" . }}-{{ $component }}
  labels:
    {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      {{- include "cd4pe.podCommon" . | nindent 6 }}
      {{- with (include "cd4pe.scheduling" .Values.pipelinesinfra) }}
      {{- . | nindent 6 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "cd4pe.pfiConfigInit" . | nindent 8 }}
      containers:
        - name: root-credentials
          image: {{ include "cd4pe.image" (dict "root" . "image" .Values.pipelinesinfra.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["com.distelli.accounts.UpdateRootCredentials"]
          env:
            {{- include "cd4pe.backendEnv" . | nindent 12 }}
            - name: JVM_ARGS
              value: "-Duser.timezone=UTC -Xmx256M"
            - name: CD4PE_ROOT_EMAIL
              value: {{ required "rootUser.email is required" .Values.rootUser.email | quote }}
            - name: CD4PE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cd4pe.secretName" . }}
                  key: root-password
          {{- with .Values.rootCredentialsJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pfi-config
              mountPath: /etc/cd4pe/pfi-config.json
              subPath: pfi-config.json
              readOnly: true
            - name: config
              mountPath: /opt/pfi/log4j2.properties
              subPath: log4j2.properties
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: pfi-config
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: {{ include "cd4pe.fullname" . }}-config
        - name: logs
          emptyDir: {}
{{- end }}
