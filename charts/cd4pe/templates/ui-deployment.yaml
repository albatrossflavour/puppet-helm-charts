{{- $component := "ui" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cd4pe.fullname" . }}-{{ $component }}
  labels:
    {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cd4pe.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cd4pe.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "cd4pe.podCommon" . | nindent 6 }}
      {{- with (include "cd4pe.scheduling" .Values.ui) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "cd4pe.image" (dict "root" . "image" .Values.ui.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "cd4pe.moduleEnv" (dict "root" . "container" "ui") | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 6
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates/base.conf.template
              subPath: base.conf.template
              readOnly: true
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: config
          configMap:
            name: {{ include "cd4pe.fullname" . }}-config
        - name: logs
          emptyDir: {}
