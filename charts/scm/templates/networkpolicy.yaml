{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scm.fullname" . }}
  labels:
    {{- include "scm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "scm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The components talk to each other.
    - from:
        - podSelector:
            matchLabels:
              {{- include "scm.selectorLabels" . | nindent 14 }}
    # frontdoor and the mTLS proxy both listen on 8080, from wherever the
    # ingress controller, PE and its agents are.
    - ports:
        - port: 8080
          protocol: TCP
{{- end }}
