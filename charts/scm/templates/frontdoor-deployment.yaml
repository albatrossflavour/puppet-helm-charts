{{- $component := "frontdoor" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scm.fullname" . }}-{{ $component }}
  labels:
    {{- include "scm.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "scm.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scm.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "scm.podCommon" . | nindent 6 }}
      {{- with (include "scm.scheduling" .Values.frontdoor) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: frontdoor
          image: {{ include "scm.image" (dict "root" . "image" .Values.frontdoor.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 15
            failureThreshold: 6
          {{- with .Values.frontdoor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: frontdoor-nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "scm.fullname" . }}-config
