{{- if not .Values.auth.existingSecret -}}
{{- /*
Everything is generated once, in the shapes complyadm generates. On upgrade
the values already in the cluster are read back with lookup, because the
database passwords are fixed in the Postgres volume at first start and the
client secrets are fixed in the Keycloak realm at first import.
lookup returns nothing under `helm template`, so rendered output shows fresh
random values every time.
*/ -}}
{{- $name := include "scm.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $generated := dict
  "postgres-password" (randAlphaNum 40)
  "comply-db-password" (randAlphaNum 40)
  "keycloak-db-password" (randAlphaNum 40)
  "hasura-admin-secret" (randAlphaNum 32)
  "redis-password" (randAlphaNum 32)
  "db-encryption-key" (randAlphaNum 12)
  "keycloak-admin-username" (uuidv4)
  "keycloak-admin-password" (uuidv4)
  "client-secret" (uuidv4)
  "cookie-secret" (randAlphaNum 32)
  "kc-account-secret" (uuidv4)
  "kc-account-console-secret" (uuidv4)
  "kc-admin-cli-secret" (uuidv4)
  "kc-broker-secret" (uuidv4)
  "kc-realm-management-secret" (uuidv4)
  "kc-security-admin-console-secret" (uuidv4)
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "scm.labels" . | nindent 4 }}
  {{- with (include "scm.keepAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $random := $generated }}
  {{ $key }}: {{ get $.Values.auth.overrides $key | default (get $existing $key | b64dec) | default $random | b64enc | quote }}
  {{- end }}
{{- end }}
