{{- $component := "postgres" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scm.fullname" . }}-{{ $component }}
  labels:
    {{- include "scm.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "scm.fullname" . }}-{{ $component }}
  selector:
    matchLabels:
      {{- include "scm.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scm.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "scm.podCommon" . | nindent 6 }}
      {{- with (include "scm.scheduling" .Values.postgresql) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "scm.image" (dict "root" . "image" .Values.postgresql.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The entrypoint starts as root to chown its directories, then drops to postgres.
          args:
            - -c
            - config_file=/bitnami/postgresql/conf/postgresql.conf
            - -c
            - hba_file=/bitnami/postgresql/conf/pg_hba.conf
          env:
            {{- include "scm.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            # Read by the init script that replaces complyadm's initdb.sql.
            {{- include "scm.secretEnv" (dict "root" . "name" "COMPLY_DB_PASSWORD" "key" "comply-db-password") | nindent 12 }}
            {{- include "scm.secretEnv" (dict "root" . "name" "KEYCLOAK_DB_PASSWORD" "key" "keycloak-db-password") | nindent 12 }}
            {{- with (include "scm.moduleEnv" (dict "root" . "container" "comply_postgres")) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "comply", "-d", "comply", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "comply", "-d", "comply", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "comply", "-d", "comply", "-h", "127.0.0.1", "-p", "5432"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
            - name: config
              mountPath: /bitnami/postgresql/conf/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
            - name: config
              mountPath: /bitnami/postgresql/conf/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint-initdb.d/10-scm-init.sh
              subPath: 10-scm-init.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-postgres" (include "scm.fullname" .)) .Values.postgresql.persistence.existingClaim }}
        - name: config
          configMap:
            name: {{ include "scm.fullname" . }}-config
