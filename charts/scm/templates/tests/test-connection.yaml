apiVersion: v1
kind: Pod
metadata:
  name: {{ include "scm.fullname" . }}-test-connection
  labels:
    {{- include "scm.componentLabels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  {{- include "scm.podCommon" . | nindent 2 }}
  restartPolicy: Never
  containers:
    # Proves frontdoor is serving. It does not prove a login works.
    - name: status
      image: {{ printf "%s:%s" .Values.initImage.repository .Values.initImage.tag | quote }}
      command: ["wget", "-q", "-T", "10", "-O", "-", {{ printf "http://%s-frontdoor:8080/healthz" (include "scm.fullname" .) | quote }}]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
