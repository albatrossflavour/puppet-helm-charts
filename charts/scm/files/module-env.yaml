# Generated by port/generate_files.py from complyadm's config() and manifests. Do not edit.
# The environment each module container gets, minus what the chart's templates set themselves.
# The chart fills in the FULLNAME, HOSTNAME and VERSION placeholders.
comply_frontdoor: {}
comply_gatekeeper: {}
comply_graphql:
  HASURA_GRAPHQL_AUTH_HOOK: http://@@FULLNAME@@-scarpy:8088/api/hasura/auth
  HASURA_GRAPHQL_CORS_DOMAIN: https://@@HOSTNAME@@
  HASURA_GRAPHQL_DEV_MODE: 'false'
  HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
  HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
  HASURA_GRAPHQL_V1_BOOLEAN_NULL_COLLAPSE: 'true'
  HASURA_SCARP_API_URL: http://@@FULLNAME@@-scarpy:8088/api
comply_graphql_init:
  DB_USER: comply
  DESIRED_SCAN_ENDPOINT: http://@@FULLNAME@@-scarpy:8088/api/v3/pe/task/ciscatscan/runScheduledScan
  HASURA_ENDPOINT: http://@@FULLNAME@@-graphql:8080
  POSTGRES_HOSTNAME: '@@FULLNAME@@-postgres'
  QUERY_API: http://@@FULLNAME@@-graphql:8080/v1
comply_identity:
  COMPLY_DB_CONNECTION: jdbc:postgresql://@@FULLNAME@@-postgres/comply?ssl=false
  COMPLY_DB_USER: comply
  JDBC_PARAMS: ssl=false
  KC_CACHE: local
  KC_DB: postgres
  KC_DB_URL_HOST: '@@FULLNAME@@-postgres'
  KC_DB_USERNAME: keycloak
  KC_HEALTH_ENABLED: 'true'
  KC_HOSTNAME: '@@HOSTNAME@@'
  KC_HTTP_ENABLED: 'true'
  KC_HTTP_RELATIVE_PATH: /auth
  KC_PROXY_HEADERS: xforwarded
  PROXY_ADDRESS_FORWARDING: 'true'
  SIGN_OUT_URL: https://@@HOSTNAME@@/sign_out
comply_postgres:
  PGDATA: /bitnami/postgresql/data
comply_redis: {}
comply_scarpy:
  DB_USER: comply
  DESIRED_SCAN_ENDPOINT: http://@@FULLNAME@@-scarpy:8088/api/v3/pe/task/ciscatscan/runScheduledScan
  INTROSPECTION_BLOCKED: 'true'
  MAX_GRAPHQL_BATCH_SIZE: '10'
  MAX_GRAPHQL_REQUESTS_LIMIT: '300'
  MAX_GRAPHQL_REQUESTS_WITHIN: '60'
  OIDC_ISSUER_URL: http://@@FULLNAME@@-identity:8080/auth/realms/Puppet
  POSTGRES_HOSTNAME: '@@FULLNAME@@-postgres'
  PROXY_IDLE_CONN_TIMEOUT: 90s
  PROXY_RESPONSE_HEADER_TIMEOUT: 10s
  PROXY_TLS_HANDSHAKE_TIMEOUT: 10s
  QUERY_API: http://@@FULLNAME@@-graphql:8080/v1
comply_scarpy_assessor_init: {}
comply_scarpy_init:
  DB_USER: comply
  IDLE_CONNS_LTS: '1'
  MAX_IDLE_CONNS: '40'
  MAX_OPEN_CONNS: '80'
  POSTGRES_HOSTNAME: '@@FULLNAME@@-postgres'
  QUERY_API: http://@@FULLNAME@@-graphql:8080/v1
  UPGRADE_PE_AGENT_RUN: 'false'
comply_ui:
  AUTH_PORT: '443'
  CHECK_UPDATES: 'false'
  HOST_FQDN: '@@HOSTNAME@@'
  HTTPS_PORT: '443'
  QUERY_API: https://@@HOSTNAME@@:443/v1/graphql
  SCARP_API: https://@@HOSTNAME@@:443/api/
comply_ui_assessor_init: {}
