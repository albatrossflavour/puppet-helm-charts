# How the scm chart's containers line up with complyadm's, and every place the
# chart differs from the module on purpose. port/check_match.py reads this.
#
# chart-sets lists the variables a template sets itself, because the value is a
# secret or comes from a chart value. Every other variable the module gives a
# container is generated into the chart's files/module-env.yaml.
#
# An allowance with a "module" value was written against that value. If a
# module release changes it, the allowance stops applying and the difference
# is reported again.

containers:
  comply_postgres:
    workload: postgres
    container: postgres
    chart-sets: [POSTGRES_PASSWORD]
  comply_redis:
    workload: redis
    container: redis
  comply_graphql:
    workload: graphql
    container: graphql
    chart-sets: [HASURA_GRAPHQL_DATABASE_URL, HASURA_GRAPHQL_ADMIN_SECRET, HASURA_GRAPHQL_LOG_LEVEL]
  comply_identity:
    workload: identity
    container: identity
    chart-sets: [KC_DB_PASSWORD, COMPLY_DB_PASSWORD, DB_ENCRYPTION_KEY, KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD, KC_LOG_LEVEL, JAVA_OPTS, FEATURES]
  comply_scarpy:
    workload: scarpy
    container: scarpy
    chart-sets: [SCARP_DEBUG_LEVEL, ASSESSOR_VERSION, FEATURES, DB_PASSWORD, DB_ENCRYPTION_KEY, HASURA_ADMIN_SECRET, WS_REPORT_PROCESSOR_URL, WS_PE_UPDATE_FACTS_POLLER_INTERVAL, WS_PE_ASSESSOR_OUT_OF_DATE_POLLER_INTERVAL, DATA_RETENTION_PERIOD]
  comply_scarpy_init:
    workload: scarpy
    container: scarpy-init
    chart-sets: [SCARP_DEBUG_LEVEL, ASSESSOR_VERSION, DB_PASSWORD, DB_ENCRYPTION_KEY]
  comply_scarpy_assessor_init:
    workload: scarpy
    container: assessor-init
    chart-sets: [ASSESSOR_VERSION]
  comply_ui:
    workload: ui
    container: ui
    chart-sets: [COMPLY_VERSION, ASSESSOR_VERSION, LOGGING, FEATURES]
  comply_ui_assessor_init:
    workload: ui
    container: assessor-init
    chart-sets: [ASSESSOR_VERSION]
  comply_gatekeeper:
    workload: gatekeeper
    container: gatekeeper
  comply_frontdoor:
    workload: frontdoor
    container: frontdoor
  comply_graphql_init:
    workload: graphql-init
    container: graphql-init
    chart-sets: [SCARP_DEBUG_LEVEL, DB_PASSWORD, HASURA_ADMIN_SECRET]
  comply_mtls_proxy:
    omitted: Off by default. It needs a certificate from the PE CA, and is in the chart behind mtlsProxy.enabled.
  comply_assessor_upgrade:
    omitted: Its command only prints the environment, database password included, so it does nothing useful.
    module-command: env

chart-only-containers:
  - workload: identity
    container: render-realm
    reason: Fills the client secrets into the realm import. complyadm renders that file on the host.
  - workload: redis
    container: render-redis-conf
    reason: Writes redis.conf with the password. complyadm renders that file on the host.

allow:
  - container: comply_gatekeeper
    kind: command
    module: "--config=/run/secrets/oauth2_proxy.cfg"
    reason: The config has no secrets in it here, so it is mounted from a ConfigMap at /etc/oauth2-proxy.
  - container: comply_gatekeeper
    kind: env-chart-only
    name: OAUTH2_PROXY_CLIENT_SECRET
    reason: complyadm writes the secret into oauth2_proxy.cfg. The chart passes it in the environment.
  - container: comply_gatekeeper
    kind: env-chart-only
    name: OAUTH2_PROXY_COOKIE_SECRET
    reason: complyadm writes the secret into oauth2_proxy.cfg. The chart passes it in the environment.
  - container: comply_graphql
    kind: env-chart-only
    name: COMPLY_DB_PASSWORD
    reason: Only there so the kubelet can expand it inside HASURA_GRAPHQL_DATABASE_URL.
  - container: comply_identity
    kind: env-omitted
    name: KC_TRUSTSTORE_PATHS
    module: /certs/cert_chain.pem
    reason: It makes Keycloak trust frontdoor's own certificate. The ingress serves the certificate here.
  - container: comply_postgres
    kind: env-chart-only
    name: COMPLY_DB_PASSWORD
    reason: Read by the init script that replaces complyadm's initdb.sql.
  - container: comply_postgres
    kind: env-chart-only
    name: KEYCLOAK_DB_PASSWORD
    reason: Read by the init script that replaces complyadm's initdb.sql.
  - container: comply_redis
    kind: env-omitted
    name: REDIS_PASSWORD
    module: fixture-redis-password
    reason: complyadm passes it for its healthcheck script. The chart's probe reads REDISCLI_AUTH.
  - container: comply_redis
    kind: env-chart-only
    name: REDISCLI_AUTH
    reason: Lets the probe run redis-cli with no shell and no password argument.
  - container: comply_scarpy
    kind: env-chart-only
    name: REDIS_PASSWORD
    reason: Only there so the kubelet can expand it inside WS_REPORT_PROCESSOR_URL.
  - container: comply_scarpy
    kind: command
    module: "sh -c 'i=0; until [ -f /Assessor-CLI/.scarp-init-complete ] || [ $i -ge 300 ]; do sleep 1; i=$((i+1)); done; [ -f /Assessor-CLI/.scarp-init-complete ] || { echo \"timed out waiting for /Assessor-CLI/.scarp-init-complete\" >&2; exit 1; }; exec scarp api --unsafe'"
    reason: complyadm polls for a sentinel file because systemd ordering does not wait. initContainers run in order, so the polling is gone.
  - container: comply_scarpy_init
    kind: command
    module: "sh -c 'rm -f /Assessor-CLI/.scarp-init-complete; i=0; until [ -f /Assessor-CLI/.copy-complete ] || [ $i -ge 60 ]; do sleep 1; i=$((i+1)); done; [ -f /Assessor-CLI/.copy-complete ] || { echo \"timed out waiting for /Assessor-CLI/.copy-complete\" >&2; exit 1; }; scarp init /Assessor-CLI/benchmarks && scarp upgrade-assessor && touch /Assessor-CLI/.scarp-init-complete'"
    reason: complyadm polls for a sentinel file because systemd ordering does not wait. initContainers run in order, so the polling is gone.
  - container: comply_frontdoor
    kind: mount-omitted
    name: "/certs"
    module: "\"${installation_dir}/comply_certs:/certs\""
    reason: The frontdoor certificate. The ingress controller terminates TLS.
  - container: comply_frontdoor
    kind: mount-omitted
    name: "/health/nginx_healthcheck.sh"
    module: "\"${installation_dir}/nginx_healthcheck.sh:/health/nginx_healthcheck.sh\""
    reason: complyadm's watchdog script. The chart's probes ask nginx's health port directly.
  - container: comply_frontdoor
    kind: port-omitted
    name: "8443"
    module: "8443"
    reason: The TLS listener. Frontdoor serves plain HTTP on 8080 behind the ingress.
  - container: comply_gatekeeper
    kind: mount-omitted
    name: "/run/secrets/oauth2_proxy.cfg"
    module: "\"${conf_file}:/run/secrets/oauth2_proxy.cfg\""
    reason: The config has no secrets in it here, so it is mounted from a ConfigMap at /etc/oauth2-proxy.
  - container: comply_gatekeeper
    kind: mount-chart-only
    name: "/etc/oauth2-proxy/oauth2_proxy.cfg"
    reason: Where the chart mounts the oauth2-proxy config.
  - container: comply_postgres
    kind: mount-omitted
    name: "/docker-entrypoint-initdb.d/initdb.sql"
    module: "\"${init_script}:/docker-entrypoint-initdb.d/initdb.sql\""
    reason: Replaced by an init script that reads the passwords from the environment, so they are not in a file.
  - container: comply_postgres
    kind: mount-chart-only
    name: "/docker-entrypoint-initdb.d/10-scm-init.sh"
    reason: The init script that replaces complyadm's initdb.sql.
