# How the cd4pe chart's containers line up with cd4peadm's, and every place the
# chart differs from the module on purpose. port/check_match.py reads this.
#
# An allowance with a "module" value was written against that value. If a
# module release changes it, the allowance stops applying and the difference
# is reported again.

containers:
  pipelinesinfra: {workload: pipelinesinfra, container: pipelinesinfra}
  query: {workload: query, container: query}
  ui: {workload: ui, container: ui}
  postgres: {workload: postgres, container: postgres}

chart-only-containers:
  - workload: pipelinesinfra
    container: render-pfi-config
    reason: Writes pfi-config.json from the Secret. cd4peadm renders that file on the host.
  - workload: root-credentials
    container: render-pfi-config
    reason: The same file, for the root credentials job.
  - workload: root-credentials
    container: root-credentials
    reason: cd4peadm sets the root credentials from a plan, cd4peadm::install::update_root_credentials. The chart runs it as a hook job.

allow:
  - container: pipelinesinfra
    kind: env-differs
    name: CD4PE_BACKEND_SERVICE_ENDPOINT
    module: http://@@HOSTNAME@@:8000
    reason: cd4peadm publishes the backend on port 8000 of the one hostname. The chart gives it its own hostname behind the ingress.
  - container: pipelinesinfra
    kind: env-differs
    name: CD4PE_WEBHOOK_URL
    module: http://cd4pe.fixture.test:8000
    reason: cd4peadm publishes the backend on port 8000 of the one hostname. The chart gives it its own hostname behind the ingress.
  - container: pipelinesinfra
    kind: env-differs
    name: JVM_ARGS
    module: "@@JVM_ARGS@@"
    reason: The manifest builds this from its default_java_args variable and the java_args setting. The snapshot diff reports a change to either.
  - container: pipelinesinfra
    kind: env-chart-only
    name: OTEL_LOGS_EXPORTER
    reason: Without it the OpenTelemetry agent retries a log export to localhost for ever and fills the pod log.
  - container: postgres
    kind: env-chart-only
    name: CD4PE_DB_PASSWORD
    reason: Read by the init script that replaces cd4peadm's initdb.sql.
  - container: postgres
    kind: env-chart-only
    name: QUERY_DB_PASSWORD
    reason: Read by the init script that replaces cd4peadm's initdb.sql.
  - container: postgres
    kind: env-chart-only
    name: PGDATA
    reason: A subdirectory of the volume, so a lost+found on a block volume does not stop initdb.
  - container: query
    kind: env-differs
    name: LOG_TO_FILE
    module: "true"
    reason: Logs go to stdout for kubectl logs.
  - container: pipelinesinfra
    kind: mount-omitted
    name: "${cd4peadm::license_install_dir()}"
    module: "\"${cd4peadm::license_install_dir()}:${cd4peadm::license_install_dir()}\""
    reason: That function returns /etc/puppetlabs/cd4pe/license, which the chart mounts as an empty directory. There is no licence upload yet.
  - container: pipelinesinfra
    kind: mount-chart-only
    name: "/etc/puppetlabs/cd4pe/license"
    reason: The licence directory, empty until the chart can load a licence.
  - container: pipelinesinfra
    kind: mount-omitted
    name: "${config['db_ca_cert_path']}"
    module: "\"${cd4peadm::external_db_ca_path()}:${config['db_ca_cert_path']}\""
    reason: The CA for an external database. The chart always runs the product's own Postgres.
  - container: pipelinesinfra
    kind: mount-omitted
    name: "/etc/nginx/certs"
    module: "'/etc/puppetlabs/cd4pe/browser_certs:/etc/nginx/certs'"
    reason: The browser certificate, for TLS on webhooks. The ingress controller terminates TLS.
  - container: pipelinesinfra
    kind: mount-omitted
    name: "/etc/puppetlabs/cd4pe/job-certs.pem"
    module: "'/etc/puppetlabs/cd4pe/job-certs.pem:/etc/puppetlabs/cd4pe/job-certs.pem'"
    reason: Not carried over yet. Job hardware is untested.
  - container: pipelinesinfra
    kind: mount-omitted
    name: "/opt/pfi/trust/trusted_certs"
    module: "\"${cd4peadm::trusted_certs_install_dir()}:/opt/pfi/trust/trusted_certs\""
    reason: Not carried over yet. There is no way to supply trusted certificates.
  - container: postgres
    kind: mount-omitted
    name: "/docker-entrypoint-initdb.d/initdb.sql"
    module: "\"${init_script}:/docker-entrypoint-initdb.d/initdb.sql\""
    reason: Replaced by an init script that reads the passwords from the environment, so they are not in a file.
  - container: postgres
    kind: mount-chart-only
    name: "/docker-entrypoint-initdb.d/10-cd4pe-init.sh"
    reason: The init script that replaces cd4peadm's initdb.sql.
  - container: postgres
    kind: mount-omitted
    name: "/var/log/postgresql"
    module: "\"${container['log_volume_name']}:${log_directory}\""
    reason: The logging collector is off, so there are no log files to keep.
  - container: query
    kind: mount-omitted
    name: "${config['db_ca_cert_path']}"
    module: "\"${cd4peadm::external_db_ca_path()}:${config['db_ca_cert_path']}\""
    reason: The CA for an external database. The chart always runs the product's own Postgres.
  - container: ui
    kind: mount-omitted
    name: "/etc/nginx/certs"
    module: "'/etc/puppetlabs/cd4pe/browser_certs:/etc/nginx/certs'"
    reason: The browser certificate. The ingress controller terminates TLS.
  - container: ui
    kind: port-omitted
    name: "8000"
    module: "8000"
    reason: The webhook server block is removed from the UI's nginx. The backend ingress goes straight to pipelinesinfra.
