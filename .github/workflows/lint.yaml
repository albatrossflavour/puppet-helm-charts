name: Lint charts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [cd4pe, scm]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Helm lint
        run: helm lint charts/${{ matrix.chart }} --strict -f charts/${{ matrix.chart }}/ci/test-values.yaml
      - name: Render and validate against Kubernetes schemas
        run: |
          helm template t charts/${{ matrix.chart }} -f charts/${{ matrix.chart }}/ci/test-values.yaml \
            | kubeconform -strict -summary

  # The chart's config files are generated from the module snapshot, and the
  # chart has to deploy what the module does. Neither check needs the Forge.
  port:
    name: port (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [cd4pe, scm]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Generated files are up to date
        run: port/generate_files.py ${{ matrix.chart }} --check
      - name: The chart matches the module
        run: port/check_match.py ${{ matrix.chart }}

  # Runs the UI's nginx config for each sign-up setting in the real UI image
  # and checks who reaches sign-up. Needs docker but no cluster.
  cd4pe-signup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Sign-up rules in the UI's nginx
        run: tests/test-cd4pe-signup.sh
