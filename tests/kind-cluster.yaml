# One-node kind cluster for the chart tests. The ingress controller's HTTPS
# port is published on 127.0.0.1:8443, so nothing privileged is bound on the
# machine running the tests.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
